<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3a3a"/>
      <stop offset="100%" stop-color="#1a8a6a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Node network -->
  <g opacity="0.4" stroke="white" stroke-width="1.5">
    <circle cx="300" cy="250" r="20" fill="none" stroke-width="2"/>
    <circle cx="500" cy="150" r="15" fill="none"/>
    <circle cx="700" cy="300" r="25" fill="none" stroke-width="2"/>
    <circle cx="900" cy="200" r="18" fill="none"/>
    <circle cx="1050" cy="350" r="20" fill="none" stroke-width="2"/>
    <circle cx="400" cy="450" r="15" fill="none"/>
    <circle cx="650" cy="500" r="22" fill="none" stroke-width="2"/>
    <circle cx="850" cy="480" r="16" fill="none"/>
    <line x1="300" y1="250" x2="500" y2="150"/>
    <line x1="500" y1="150" x2="700" y2="300"/>
    <line x1="700" y1="300" x2="900" y2="200"/>
    <line x1="900" y1="200" x2="1050" y2="350"/>
    <line x1="300" y1="250" x2="400" y2="450"/>
    <line x1="400" y1="450" x2="650" y2="500"/>
    <line x1="650" y1="500" x2="850" y2="480"/>
    <line x1="700" y1="300" x2="650" y2="500"/>
    <line x1="850" y1="480" x2="1050" y2="350"/>
  </g>
  <!-- Chart bars -->
  <g transform="translate(200, 350)" opacity="0.2">
    <rect x="0" y="200" width="60" height="100" rx="4" fill="white"/>
    <rect x="80" y="150" width="60" height="150" rx="4" fill="white"/>
    <rect x="160" y="80" width="60" height="220" rx="4" fill="white"/>
    <rect x="240" y="120" width="60" height="180" rx="4" fill="white"/>
    <rect x="320" y="40" width="60" height="260" rx="4" fill="white"/>
    <rect x="400" y="100" width="60" height="200" rx="4" fill="white"/>
    <rect x="480" y="0" width="60" height="300" rx="4" fill="white"/>
    <rect x="560" y="60" width="60" height="240" rx="4" fill="white"/>
    <rect x="640" y="130" width="60" height="170" rx="4" fill="white"/>
    <rect x="720" y="50" width="60" height="250" rx="4" fill="white"/>
  </g>
</svg>
