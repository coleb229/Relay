<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f8f7fc"/>
  <!-- Bookshelf -->
  <g transform="translate(80, 120)">
    <!-- Shelf frame -->
    <rect x="0" y="0" width="240" height="200" rx="6" fill="none" stroke="#c4b8e0" stroke-width="2"/>
    <!-- Shelves -->
    <line x1="0" y1="100" x2="240" y2="100" stroke="#c4b8e0" stroke-width="2"/>
    <!-- Top shelf - empty except one leaning book -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="15" height="40" rx="2" fill="#d4b8e8" transform="rotate(-8, 7.5, 40)"/>
    </g>
    <!-- Bottom shelf - empty -->
    <!-- Plant on bottom shelf -->
    <g transform="translate(180, 130)">
      <!-- Pot -->
      <path d="M5,40 L10,20 L40,20 L45,40 Z" fill="#d4a07a" opacity="0.7"/>
      <rect x="8" y="15" width="34" height="8" rx="2" fill="#d4a07a" opacity="0.8"/>
      <!-- Leaves -->
      <path d="M25,18 Q15,-5 5,10" fill="none" stroke="#7ab88f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M25,18 Q35,-5 45,10" fill="none" stroke="#7ab88f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M25,15 Q25,-10 25,-5" fill="none" stroke="#7ab88f" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Text -->
  <text x="200" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#9b8ec4" opacity="0.8">No courses yet</text>
</svg>
