<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1145"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
  </defs>
  <rect width="540" height="960" fill="url(#bg)"/>
  <!-- Floating book -->
  <g transform="translate(170, 350)" opacity="0.8">
    <rect x="0" y="0" width="100" height="130" rx="4" fill="none" stroke="#d4a04a" stroke-width="2"/>
    <rect x="5" y="5" width="90" height="120" rx="2" fill="none" stroke="#d4a04a" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="30" x2="85" y2="30" stroke="#d4a04a" stroke-width="1" opacity="0.4"/>
    <line x1="15" y1="50" x2="75" y2="50" stroke="#d4a04a" stroke-width="1" opacity="0.3"/>
    <line x1="15" y1="70" x2="80" y2="70" stroke="#d4a04a" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Floating book 2 -->
  <g transform="translate(300, 500) rotate(-15)" opacity="0.6">
    <rect x="0" y="0" width="80" height="110" rx="4" fill="none" stroke="#d4a04a" stroke-width="1.5"/>
    <line x1="12" y1="25" x2="68" y2="25" stroke="#d4a04a" stroke-width="1" opacity="0.4"/>
    <line x1="12" y1="42" x2="60" y2="42" stroke="#d4a04a" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Graduation cap -->
  <g transform="translate(220, 230)" opacity="0.8">
    <polygon points="50,0 100,25 50,50 0,25" fill="none" stroke="#d4a04a" stroke-width="2"/>
    <line x1="50" y1="50" x2="50" y2="75" stroke="#d4a04a" stroke-width="1.5"/>
    <line x1="25" y1="37" x2="25" y2="60" stroke="#d4a04a" stroke-width="1"/>
    <line x1="75" y1="37" x2="75" y2="60" stroke="#d4a04a" stroke-width="1"/>
    <path d="M25,60 Q50,75 75,60" fill="none" stroke="#d4a04a" stroke-width="1"/>
  </g>
  <!-- Connection lines and nodes -->
  <g opacity="0.3" stroke="#7c6ff5" stroke-width="1">
    <circle cx="150" cy="300" r="4" fill="#7c6ff5"/>
    <circle cx="350" cy="400" r="3" fill="#7c6ff5"/>
    <circle cx="200" cy="600" r="4" fill="#7c6ff5"/>
    <circle cx="400" cy="650" r="3" fill="#7c6ff5"/>
    <circle cx="270" cy="780" r="4" fill="#7c6ff5"/>
    <line x1="150" y1="300" x2="350" y2="400"/>
    <line x1="350" y1="400" x2="200" y2="600"/>
    <line x1="200" y1="600" x2="400" y2="650"/>
    <line x1="400" y1="650" x2="270" y2="780"/>
    <line x1="150" y1="300" x2="200" y2="600"/>
  </g>
  <!-- Glowing dots -->
  <g opacity="0.5">
    <circle cx="100" cy="200" r="2" fill="#d4a04a"/>
    <circle cx="430" cy="300" r="2" fill="#d4a04a"/>
    <circle cx="80" cy="700" r="2" fill="#d4a04a"/>
    <circle cx="460" cy="800" r="2" fill="#d4a04a"/>
    <circle cx="270" cy="150" r="2" fill="#7c6ff5"/>
    <circle cx="450" cy="550" r="2" fill="#7c6ff5"/>
  </g>
</svg>
